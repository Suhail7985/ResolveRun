name: resolverun

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolverun
      POSTGRES_PASSWORD: resolverun
      POSTGRES_DB: resolverun
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolverun"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/api/index.js"
    environment:
      DATABASE_URL: postgresql://resolverun:resolverun@postgres:5432/resolverun
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-in-production-32chars
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/worker/main.js
    environment:
      DATABASE_URL: postgresql://resolverun:resolverun@postgres:5432/resolverun
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-in-production-32chars
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/worker/main.js
    environment:
      DATABASE_URL: postgresql://resolverun:resolverun@postgres:5432/resolverun
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-in-production-32chars
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/scheduler/main.js
    environment:
      DATABASE_URL: postgresql://resolverun:resolverun@postgres:5432/resolverun
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-in-production-32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
